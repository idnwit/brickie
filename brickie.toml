# brickie's own architecture, checked by brickie. Crates by layer:
#   cli (the `brickie` binary) -> web (server, viewer) -> core (model, facts, measure, check)
#   core and web build on lib (independent libraries: algo, codeview; no brickie types).
# Each composite splits further in its own brickie.toml (crates/lib, crates/core, crates/web).

[[brick]]
name = "lib"
path = "crates/lib"                   # composite: algo, codeview
tags = ["lib"]
desc = "Independent libraries: algorithms and the code viewer, no brickie business"

[[brick]]
name = "core"
path = "crates/core"                  # composite: model, facts, measure, check
tags = ["domain"]
desc = "brickie's business logic: shared model, cache, measure and check"

[[brick]]
name = "web"
path = "crates/web"                   # composite: api, server (brickie-web), ui (brickie-ui)
tags = ["domain"]
desc = "The reviewer webview: axum server and the hydrated viewer"

[[brick]]
name = "cli"
members = ["brickie"]                 # the binary, its tests
tags = ["domain"]
desc = "The `brickie` command line: measure, check, serve, llms"

[[rule]]
from = "cli"
to = "core"
scope = "all"
reason = "the commands drive measure and check"

[[rule]]
from = "cli"
to = "web"
scope = "all"
reason = "`brickie serve` starts the server"

[[rule]]
from = "web"
to = "core"
scope = "all"
reason = "the server reads the cache and checks; the viewer shares the model"

[[rule]]
from = "core"
to = "lib"
scope = "all"
reason = "measure and check use the metrics, scanner and graph libraries"

[[rule]]
from = "web"
to = "lib"
scope = "all"
reason = "the viewer lays out the brick graph; the server mounts the code viewer and implements its port"

# lib depends on nothing of brickie: no rule allows lib -> *.

# Business logic: strict, an error (docs/design/complexity.md).
[[complexity]]
bricks = "tag:domain"
cognitive = 15
nesting = 4
params = 6
lines = 80

# Hard ceiling for every brick, including a new one without a tag: past this a function is
# unreviewable. An error, so CI fails.
[[complexity]]
bricks = "*"
cognitive = 60
nesting = 6
lines = 200

# Test code: only the extreme cases.
[[complexity]]
bricks = "*"
scope = "test"
cognitive = 40
lines = 150



[[link]]
from = "cli"
to = "core"
kinds = ["uses"]
reason = "the commands run measure and check and print their results"

[[link]]
from = "cli"
to = "web"
kinds = ["uses"]
scope = "prod"
reason = "`brickie serve` starts the reviewer server"

[[link]]
from = "core"
to = "lib"
kinds = ["reexports", "uses"]
reason = "measure and check call the metrics, scanner and graph libraries"

[[link]]
from = "web"
to = "core"
kinds = ["uses"]
reason = "the server loads the cache and runs the checks, and the viewer reads the shared model"

[[link]]
from = "web"
to = "lib"
kinds = ["implements", "uses"]
reason = "the viewer lays out the brick graph, and the server mounts the code viewer and implements its provider port"
