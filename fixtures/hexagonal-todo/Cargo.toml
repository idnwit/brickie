[workspace]
members = [
  "crates/domain",
  "crates/application",
  "crates/adapters/memory",
  "crates/adapters/storage",
  "crates/ui",
  "crates/app",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
todo-domain = { path = "crates/domain" }
todo-application = { path = "crates/application" }
todo-adapter-memory = { path = "crates/adapters/memory" }
todo-adapter-storage = { path = "crates/adapters/storage" }
todo-ui = { path = "crates/ui" }
sycamore = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
