
[[brick]]
name = "adapters"
tags = ["adapter"]
path = "crates/adapters"
desc = "Driven adapters (in-memory, JSON local storage)"

[[brick]]
name = "app"
members = ["todo-app"]
desc = "Composition root: wires adapters into use cases and mounts the UI"

[[brick]]
name = "application"
tags = ["core"]
path = "crates/application"
desc = "Application layer: ports and use cases"

[[brick]]
name = "domain"
tags = ["core"]
path = "crates/domain"
desc = "Domain layer: entities, value objects, board invariants"
members = ["path:crates/domain/"]

[[brick]]
name = "ui"
members = ["path:crates/ui/"]
tags = ["adapter"]
path = "crates/ui"
desc = "Driving adapter: Sycamore components"

[[rule]]
from = "adapters"
to = "application"
scope = "all"
reason = "driven adapters implement the storage ports only"

[[rule]]
from = "application"
to = "domain"
scope = "all"
reason = "the application layer is written in domain types"

[[rule]]
from = "adapters"
to = "domain"
scope = "all"
reason = "driven adapters store and load domain entities"

[[rule]]
from = "ui"
to = "domain"
kinds = ["uses"]
scope = "all"
reason = "the UI renders domain values (read-only use)"

[[rule]]
from = "ui"
to = "application"
scope = "all"
reason = "the UI drives the application only through BoardService"

[[rule]]
from = "app"
to = "application"
reason = "the composition root builds the interactor and wires the ports"

[[rule]]
from = "app"
to = "adapters"
reason = "the composition root picks the driven adapters"

[[rule]]
from = "app"
to = "ui"
reason = "the composition root mounts the UI (wasm32 only, measured via additional_targets)"

[[rule]]
from = "app"
to = "domain"
reason = "the smoke run and the wiring use domain value types"

[[complexity]]
cognitive = 15
nesting = 4
params = 5

[measure]
additional_targets = ["wasm32-unknown-unknown"]

[[link]]
from = "adapters"
to = "application/board-storage"
kinds = ["implements", "uses"]
reason = "the adapters implement the repository and id ports the application defines"

[[link]]
from = "adapters"
to = "domain"
kinds = ["uses"]
reason = "the adapters store and load domain entities"

[[link]]
from = "app"
to = "adapters"
kinds = ["uses"]
scope = "prod"
reason = "the composition root creates the driven adapters"

[[link]]
from = "app"
to = "application"
kinds = ["uses"]
scope = "prod"
reason = "the composition root builds the interactor and wires the ports"

[[link]]
from = "app"
to = "domain"
kinds = ["uses"]
scope = "prod"
reason = "the composition root uses domain value types in the wiring and smoke run"

[[link]]
from = "app"
to = "ui"
kinds = ["uses"]
scope = "prod"
reason = "the composition root mounts the UI"

[[link]]
from = "application"
to = "domain"
kinds = ["uses"]
reason = "use cases are written in domain entities and values"

[[link]]
from = "ui"
to = "application/board-service"
kinds = ["implements", "uses"]
reason = "the UI drives the application only through the BoardService trait and its drafts and views"

[[link]]
from = "ui"
to = "domain"
kinds = ["uses"]
reason = "the UI renders domain values"
