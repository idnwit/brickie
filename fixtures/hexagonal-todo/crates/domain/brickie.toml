exports = ["column", "note", "board", "kernel"]
[[brick]]
name = "kernel"
members = ["path:src/lib.rs", "todo-domain::error"]
desc = "DomainError"

[[brick]]
name = "column"
members = ["todo-domain::column"]
desc = "Column entity and values"

[[brick]]
name = "note"
members = ["todo-domain::note"]
desc = "Note entity and values"

[[brick]]
name = "board"
members = ["todo-domain::board"]
desc = "Board aggregate, invariants"

[[rule]]
from = "column"
to = "kernel"
scope = "all"
reason = "values report DomainError"

[[rule]]
from = "note"
to = "kernel"
scope = "all"
reason = "values report DomainError"

[[rule]]
from = "note"
to = "column"
scope = "all"
reason = "a note is placed in a column"

[[rule]]
from = "board"
to = "*"
scope = "all"
reason = "the aggregate composes everything"

[[rule]]
from = "kernel"
to = "*"
scope = "all"
reason = "the crate root declares the submodules"

[[link]]
from = "board"
to = "column"
kinds = ["uses"]
reason = "the board aggregate owns its columns and enforces their invariants"

[[link]]
from = "board"
to = "kernel"
kinds = ["uses"]
reason = "the board reports invariant violations as DomainError"

[[link]]
from = "board"
to = "note"
kinds = ["uses"]
reason = "the board aggregate holds the notes placed in its columns"

[[link]]
from = "column"
to = "kernel"
kinds = ["uses"]
reason = "column values report invalid input as DomainError"

[[link]]
from = "note"
to = "column"
kinds = ["uses"]
reason = "a note refers to the column it is placed in"

[[link]]
from = "note"
to = "kernel"
kinds = ["uses"]
reason = "note values report invalid input as DomainError"
