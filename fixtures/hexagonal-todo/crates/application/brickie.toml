exports = ["board-service", "board-storage", "usecases"]

[[brick]]
name = "board-service"
members = ["todo-application::ports::inbound"]
tags = ["port"]
desc = "BoardService trait, drafts and views"

[[brick]]
name = "board-storage"
members = ["todo-application::ports::outbound"]
tags = ["port"]
desc = "Repositories and IdGenerator"

[[brick]]
name = "usecases"
members = [
    "path:src/lib.rs",
    "path:src/ports/mod.rs",
    "path:src/usecases/mod.rs",
    "todo-application::usecases::tests",
    "todo-application::usecases::view",
]
desc = "BoardInteractor: implements BoardService, delegates to feature functions"

[[brick]]
name = "usecases-columns"
members = ["todo-application::usecases::columns"]
desc = "Column use cases"

[[brick]]
name = "usecases-notes"
members = ["todo-application::usecases::notes"]
desc = "Note use cases"

[[rule]]
from = "usecases"
to = "*"
scope = "all"
reason = "the interactor wires feature use cases to ports"

[[rule]]
from = "usecases-columns"
to = "board-service"
scope = "all"
reason = "column use cases take drafts and return the service's errors"

[[rule]]
from = "usecases-columns"
to = "board-storage"
scope = "all"
reason = "column use cases load and save the board through the ports"

[[rule]]
from = "usecases-notes"
to = "board-service"
scope = "all"
reason = "note use cases take drafts and return the service's errors"

[[rule]]
from = "usecases-notes"
to = "board-storage"
scope = "all"
reason = "note use cases load and save the board through the ports"

[[link]]
from = "usecases"
to = "board-service"
kinds = ["implements", "uses"]
reason = "the interactor implements the BoardService trait and returns its views"

[[link]]
from = "usecases"
to = "board-storage"
kinds = ["implements", "uses"]
reason = "the interactor loads and saves boards through the repository ports"

[[link]]
from = "usecases"
to = "usecases-columns"
kinds = ["uses"]
scope = "prod"
reason = "the interactor delegates column operations to the column use cases"

[[link]]
from = "usecases"
to = "usecases-notes"
kinds = ["uses"]
scope = "prod"
reason = "the interactor delegates note operations to the note use cases"

[[link]]
from = "usecases-columns"
to = "board-service"
kinds = ["uses"]
scope = "prod"
reason = "column use cases take drafts and return the service's errors"

[[link]]
from = "usecases-columns"
to = "board-storage"
kinds = ["uses"]
scope = "prod"
reason = "column use cases load and save the board through the ports"

[[link]]
from = "usecases-notes"
to = "board-service"
kinds = ["uses"]
scope = "prod"
reason = "note use cases take drafts and return the service's errors"

[[link]]
from = "usecases-notes"
to = "board-storage"
kinds = ["uses"]
scope = "prod"
reason = "note use cases load and save the board through the ports"
