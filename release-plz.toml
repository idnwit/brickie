# Git-only releases: a `v{version}` tag, a GitHub release and a CHANGELOG.md (git-cliff defaults).
# Nothing is published to crates.io (every crate has `publish = false`).
[workspace]
changelog_update = true
git_release_enable = true
git_tag_enable = true
publish = false
semver_check = false

# One version for the tool (`crates/cli`); the library crates are internal.
[[package]]
name = "brickie-model"
release = false

[[package]]
name = "brickie-facts"
release = false

[[package]]
name = "brickie-measure"
release = false

[[package]]
name = "brickie-check"
release = false

[[package]]
name = "brickie-layout"
release = false

[[package]]
name = "brickie-graph"
release = false

[[package]]
name = "brickie-rustscan"
release = false

[[package]]
name = "brickie-metrics"
release = false

[[package]]
name = "brickie-web"
release = false

[[package]]
name = "brickie-ui"
release = false

[[package]]
name = "brickie"
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_path = "CHANGELOG.md"
