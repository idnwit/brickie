# Example brickie.toml: a port, an engine core, adapter backends and an assembling client.
# A preset is just another file with the same schema:  include = ["presets/layered.toml"]
# (paths are relative to the including file; lists are concatenated).
# Names, tags and rules are local to a file; see web/brickie.toml for a composite's own file.

[[brick]]
name = "audio"
members = ["acme-audio"]          # package name: all its targets
tags = ["port"]
# independent = true               # a library for the bricks around it (any level)

[[brick]]
name = "engine"
members = ["acme-engine"]
tags = ["core"]

[[brick]]
name = "backends"
members = ["acme-backends"]                       # package | crate::module prefix | path:<dir>/
tags = ["adapter"]

[[brick]]
name = "client"
members = ["acme-client"]
tags = ["assembly"]

[[brick]]
name = "web"
path = "web"                       # composite: children in web/brickie.toml (required);
tags = ["assembly"]                # members default to ["path:web/"] (crates under the folder)

# Rules are principles: what the design allows. Nothing else is allowed, there is no deny.
[[rule]]
from = "tag:assembly"              # brick name | tag:<tag> | *
to = "*"
reason = "assemblies wire everything together"   # required

[[rule]]
from = "tag:core"
to = "tag:port"
kinds = ["uses", "implements"]     # default: all kinds
scope = "prod"                     # prod | test | all (default)
reason = "the core is written against the port traits"

[[rule]]
from = "tag:assembly"
to = "tag:adapter"
reason = "assemblies choose the adapters"

# Links are the dependencies the code may really have, each valid only if a rule allows it.
# A code edge no valid link covers is `deps/unlinked`.
[[link]]
from = "engine"
to = "audio"
kinds = ["uses", "implements"]
reason = "the engine renders through the audio port"

[[link]]
from = "client"
to = "engine"
reason = "the client drives the engine"

[[link]]
from = "client"
to = "backends"
reason = "the client picks the adapter"

[[link]]
from = "client"
to = "web/api"                     # `composite/child`: the child must be in web's `exports`
reason = "the client calls the web api"

[[complexity]]
bricks = "tag:core"                # default: *
cognitive = 15                     # a function fails when its value is above the limit
nesting = 3
paths = 200
params = 5
