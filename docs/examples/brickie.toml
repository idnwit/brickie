# Example brickie.toml: a port, an engine core, adapter backends and an assembling client.
# A preset is just another file with the same schema:  include = ["presets/layered.toml"]
# (paths are relative to the including file; lists are concatenated).
# Names, tags and rules are local to a file; see web/brickie.toml for a composite's own file.

[[brick]]
name = "audio"
members = ["acme-audio"]          # package name: all its targets
tags = ["port"]
# independent = true               # root bricks only: acts like an external library

[[brick]]
name = "engine"
members = ["acme-engine"]
tags = ["core"]

[[brick]]
name = "backends"
members = ["acme-backends"]                       # package | crate::module prefix | path:<dir>/
tags = ["adapter"]

[[brick]]
name = "client"
members = ["acme-client"]
tags = ["assembly"]

[[brick]]
name = "web"
path = "web"                       # composite: children in web/brickie.toml (required);
tags = ["assembly"]                # members default to ["path:web/"] (crates under the folder)

# An edge no rule allows is denied; sibling cycles are always errors.
[[rule]]
from = "tag:assembly"              # brick name | tag:<tag> | *
to = "*"
action = "allow"
reason = "assemblies wire everything together"

[[rule]]
from = "tag:core"
to = "tag:adapter"
kinds = ["uses", "implements"]     # default: all kinds
scope = "prod"                     # prod (default) | test | all
action = "deny"
reason = "core must not use adapter"

[[rule]]
from = "*"
to = "tag:port"
action = "allow"
reason = "everyone may depend on the port traits"

[[complexity]]
bricks = "tag:core"                # default: *
cognitive = 15                     # a function fails when its value is above the limit
nesting = 3
paths = 200
params = 5
