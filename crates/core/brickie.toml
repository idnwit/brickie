# The core crates: model (light, wasm-safe shared types) is the base; facts is the cache;
# measure and check are independent flows that share only facts and model; change (design
# change sessions) builds on check's loader.
exports = ["model", "facts", "measure", "check", "change"]

[[brick]]
name = "model"
members = ["brickie-model"]
tags = ["base"]
desc = "Shared wasm-safe types: diagnostic levels, codes and values, function trees"

[[brick]]
name = "facts"
members = ["brickie-facts"]
tags = ["facts"]
desc = "The measure cache: facts model, hashing and source files"

[[brick]]
name = "measure"
path = "measure"                      # composite: workspace, scip, run
tags = ["flow"]
desc = "`brickie measure`: cargo metadata, rust-analyzer SCIP and complexity into the cache"

[[brick]]
name = "check"
path = "check"                        # composite: diag, config, rules, review, check
tags = ["flow"]
desc = "`brickie check`: config, rules, review and diagnostics over the cache"

[[brick]]
name = "change"
members = ["brickie-change"]
tags = ["flow"]
desc = "Design change sessions: op log, review, preview over the loader, publish and scaffold"

[[rule]]
from = "tag:flow"
to = "facts"
scope = "all"
reason = "measure writes the cache, check reads it"

[[rule]]
from = "tag:flow"
to = "model"
scope = "all"
reason = "measure builds function trees, check produces diagnostics"

[[rule]]
from = "change"
to = "check"
scope = "all"
reason = "the preview is loaded and checked by check's loader over a virtual file set"

[[link]]
from = "change"
to = "check"
kinds = ["implements", "uses"]
reason = "a design change is previewed by loading and checking the edited design with check's loader"

[[link]]
from = "change"
to = "facts"
kinds = ["uses"]
reason = "a design change reads the measured cache to judge the edited design"

[[link]]
from = "change"
to = "model"
kinds = ["uses"]
reason = "the change report is built from diagnostics and levels defined in the model"

[[link]]
from = "check"
to = "facts"
kinds = ["uses"]
reason = "check reads the measured cache to evaluate rules"

[[link]]
from = "check"
to = "model"
kinds = ["reexports", "uses"]
reason = "check turns findings into the shared diagnostics and re-exports the model's codes"

[[link]]
from = "measure"
to = "facts"
kinds = ["uses"]
reason = "measure writes what it learns into the cache facts"

[[link]]
from = "measure"
to = "model"
kinds = ["uses"]
scope = "prod"
reason = "measure stores function trees in the shared model types"
