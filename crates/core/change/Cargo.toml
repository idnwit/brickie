[package]
name = "brickie-change"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "brickie's versioned design: direct edits of the brickie.toml tree with history, undo and stale-base checks"
license = "MIT"
publish = false

[dependencies]
brickie-check = { workspace = true }
brickie-facts = { workspace = true }
brickie-model = { workspace = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3"
