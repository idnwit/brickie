[package]
name = "brickie-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "brickie's engine: measure, cache, config, rules, check and review"
license = "MIT"
publish = false

[dependencies]
brickie-model = { path = "../model" }
anyhow = "1"
cargo_metadata = "0.23"
protobuf = "=3.7.2"
scip = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
toml_edit = "0.25.19"
tree-sitter = "0.26.13"
tree-sitter-rust = "0.24.2"
