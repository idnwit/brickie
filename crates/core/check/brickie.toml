# brickie-check by folder: `diag` and `config` <- `rules` / `interface` <- `check`. `rules` stays
# internal: the CLI and the webview use it through the `check` facade; `config` holds `decide`.
exports = ["check", "diag", "config", "interface"]

[[brick]]
name = "check"
members = ["brickie-check::check", "path:src/lib.rs"]   # `check` and the crate root
tags = ["facade"]
desc = "Load config and cache into diagnostics; the facade for CLI and webview"

[[brick]]
name = "rules"
members = ["brickie-check::rules"]
tags = ["rules"]
desc = "Rule evaluation: dependency rules, cycles, complexity, unmapped and stale"

[[brick]]
name = "interface"
members = ["brickie-check::interface"]
tags = ["rules"]
desc = "Brick interfaces: declared items, their uses, `interface/unused`, and the sites behind an edge"

[[brick]]
name = "config"
members = ["brickie-check::config"]
tags = ["config"]
desc = "brickie.toml schema, loading, validation and module resolution"

[[brick]]
name = "diag"
members = ["brickie-check::diag"]
tags = ["base"]
desc = "Findings, diagnostics and their text rendering"

[[rule]]
from = "rules"
to = "config"
scope = "all"
action = "allow"
reason = "rules evaluate the configured bricks"

[[rule]]
from = "rules"
to = "diag"
scope = "all"
action = "allow"
reason = "rules produce findings"

[[rule]]
from = "check"
to = "*"
scope = "all"
action = "allow"
reason = "the facade combines config, rules and diagnostics"

[[rule]]
from = "interface"
to = "config"
scope = "all"
action = "allow"
reason = "interfaces follow the configured exports"

[[rule]]
from = "interface"
to = "diag"
scope = "all"
action = "allow"
reason = "unused items are findings"
