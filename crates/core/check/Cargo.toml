[package]
name = "brickie-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "brickie check: config, rules, diagnostics and review over the cache"
license = "MIT"
publish = false

[dependencies]
brickie-facts = { path = "../facts" }
brickie-model = { path = "../model" }
brickie-graph = { path = "../../algo/graph" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3"
