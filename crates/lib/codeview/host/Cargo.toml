[package]
name = "codeview-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Code viewer host: axum router over a provider, serves the bundle and endpoints"
license = "MIT"
publish = false

[dependencies]
codeview-port = { workspace = true }
axum = "0.8"
serde = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
