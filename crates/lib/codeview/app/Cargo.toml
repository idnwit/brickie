[package]
name = "codeview-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Code viewer UI (wasm): explorer, tabs and Monaco glue"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codeview-port = { workspace = true }
serde = "1"
serde_json = "1"
sycamore = { version = "0.9", default-features = false, features = ["web"] }
# Must match the wasm-bindgen CLI used by scripts/build-codeview.sh.
wasm-bindgen = "=0.2.123"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Location", "MessageEvent", "KeyboardEvent", "MouseEvent", "Event", "EventTarget", "Request", "RequestInit", "Response", "Headers", "MediaQueryList", "UrlSearchParams"] }
