# brickie-ui by folder: platform (DOM and wasm wrappers, depends on nothing) and state (pure
# reactive state over the web api's page data) sit under components.
# The crate root (lib.rs, wasm.rs) belongs to `components`, which it wires up and re-exports.
exports = ["components", "state"]

[[brick]]
name = "state"
members = ["brickie-ui::state"]
tags = ["state"]
desc = "Reactive viewer state: selection, focus, layers, evaluation and layout context; no DOM access"

[[brick]]
name = "platform"
members = ["brickie-ui::platform"]
tags = ["platform"]
desc = "Browser wrappers (location, history, DOM, fetch) that are no-ops during server rendering"

[[brick]]
name = "components"
members = ["brickie-ui"]              # the crate root, wasm entry and `components`; folders win
tags = ["view"]
desc = "Sycamore components (canvas, controls, panels, source) and the crate entry points"

[deps]
default = "deny"
cycles = "deny"

[[deps.rule]]
from = "components"
to = "*"
scope = "all"
action = "allow"
reason = "components render state and the api data and call the browser wrappers"
