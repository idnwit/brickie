# brickie-web by folder: routes -> render -> data. The crate root (the `run` entry, app state)
# and the tests belong to `routes`, the layer that wires everything together.
exports = ["routes"]

[[brick]]
name = "routes"
members = ["brickie-web::routes", "brickie-web::events", "brickie-web::measure", "brickie-web::tests", "path:src/lib.rs", "path:build.rs"]   # crate root and build script, `routes`, events, measure and tests
tags = ["http"]
desc = "HTTP layer: router, handlers (incl. the change endpoints and their write guard), app state, wasm assets, and the crate's tests"

[[brick]]
name = "render"
members = ["brickie-web::render"]
tags = ["view"]
desc = "HTML page: the SSR shell around the viewer"

[[brick]]
name = "data"
members = ["brickie-web::data"]
tags = ["data"]
desc = "Page data: diagnostics, functions, graph levels and the change view built from the check result"

[[brick]]
name = "code"
members = ["brickie-web::code"]
tags = ["data"]
desc = "Adapter for the code viewer: implements codeview's provider port from the workspace"

[[rule]]
from = "routes"
to = "render"
scope = "all"
reason = "handlers answer with rendered pages"

[[rule]]
from = "routes"
to = "data"
scope = "all"
reason = "handlers build page data from the check result"

[[rule]]
from = "routes"
to = "code"
scope = "all"
reason = "the router mounts the code viewer with brickie's provider"

[[link]]
from = "routes"
to = "code"
kinds = ["uses"]
scope = "prod"
reason = "the router mounts the code viewer with brickie's provider"

[[link]]
from = "routes"
to = "data"
kinds = ["uses"]
scope = "prod"
reason = "handlers build their JSON answers from the data layer"

[[link]]
from = "routes"
to = "render"
kinds = ["uses"]
scope = "prod"
reason = "the page handler wraps the viewer in the rendered HTML shell"
