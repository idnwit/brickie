# brickie-web by folder: routes -> render -> data. The crate root (the `run` entry, app state)
# and the tests belong to `routes`, the layer that wires everything together.
exports = ["routes"]

[[brick]]
name = "routes"
members = ["brickie-web"]             # the crate root, `routes` and tests; the folders below win
tags = ["http"]
desc = "HTTP layer: router, handlers, app state, wasm assets, and the crate's tests"

[[brick]]
name = "render"
members = ["brickie-web::render"]
tags = ["view"]
desc = "HTML page: the SSR shell around the viewer"

[[brick]]
name = "data"
members = ["brickie-web::data"]
tags = ["data"]
desc = "Page data: diagnostics, functions and graph levels built from the check result"

[[brick]]
name = "code"
members = ["brickie-web::code"]
tags = ["data"]
desc = "Adapter for the code viewer: implements codeview's provider port from the workspace"

[deps]
default = "deny"
cycles = "deny"

[[deps.rule]]
from = "routes"
to = "render"
scope = "all"
action = "allow"
reason = "handlers answer with rendered pages"

[[deps.rule]]
from = "routes"
to = "data"
scope = "all"
action = "allow"
reason = "handlers build page data from the check result"

[[deps.rule]]
from = "render"
to = "data"
scope = "all"
action = "allow"
reason = "pages embed the page data"

[[deps.rule]]
from = "routes"
to = "code"
scope = "all"
action = "allow"
reason = "the router mounts the code viewer with brickie's provider"
