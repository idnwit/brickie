# The webview crates: server (axum, brickie-web) renders and serves the viewer (ui, wasm).
# Each is a composite with its own folder bricks (see server/brickie.toml, ui/brickie.toml).
exports = ["server"]

[[brick]]
name = "server"
path = "server"                       # composite: routes, render, data
tags = ["server"]
desc = "axum server: SSR page, JSON API, source view, review edits, embedded wasm bundle"

[[brick]]
name = "ui"
path = "ui"                           # composite: model, state, platform, components
tags = ["view"]
desc = "The viewer components (Sycamore): rendered on the server, hydrated in the browser"

[deps]
default = "deny"
cycles = "deny"

[[deps.rule]]
from = "server"
to = "ui"
scope = "all"
action = "allow"
reason = "the server renders the viewer and shares its page-data model"
