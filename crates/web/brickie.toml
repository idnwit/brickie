# The webview crates: server (axum, brickie-web) renders and serves the viewer (ui, wasm).
# The viewer depends on core's model and the layout library only, never on measure or check.
exports = ["server"]

[[brick]]
name = "server"
members = ["brickie-web"]
tags = ["server"]
desc = "axum server: SSR page, JSON API, source view, review edits, embedded wasm bundle"

[[brick]]
name = "ui"
members = ["brickie-ui"]
tags = ["view"]
desc = "The viewer components (Sycamore): rendered on the server, hydrated in the browser"

[deps]
default = "deny"
cycles = "deny"

[[deps.rule]]
from = "server"
to = "ui"
scope = "all"
action = "allow"
reason = "the server renders the viewer and shares its page-data model"
