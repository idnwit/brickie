name: release binaries

# Note: a release created by release-plz with the default GITHUB_TOKEN does not fire this
# trigger; set the RELEASE_PLZ_TOKEN secret (see release-plz.yml) so it does.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.123

jobs:
  build:
    # Only versioned releases (v*), not the rolling `dev` prerelease.
    if: startsWith(github.event.release.tag_name, 'v')
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: scripts/build-ui.sh
      - name: Build release binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=${HOME}=~ --remap-path-prefix=$(pwd)=."
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          name="brickie-${{ matrix.target }}"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${name}.tar.gz" brickie
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"; fi
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
