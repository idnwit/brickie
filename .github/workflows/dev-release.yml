name: dev release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: 0.2.123

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - run: scripts/build-ui.sh
      - name: Build release binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=${HOME}=~ --remap-path-prefix=$(pwd)=."
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          name="brickie-${{ matrix.target }}"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${name}.tar.gz" brickie
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: brickie-${{ matrix.target }}
          path: dist/*

  publish:
    name: publish dev release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Recreate the rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* \
            --target "$SHA" \
            --prerelease \
            --title "dev (rolling)" \
            --notes "Rolling build of \`main\` at commit ${SHA}. Not a stable release."
